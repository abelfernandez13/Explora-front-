<menu class="flex justify-between gap-3 pt-4" step-actions>
  @if (showBack()) {
  <button
    [attr.type]="backType()"
    (click)="back.emit()"
    [disabled]="backDisabled()"
    class="px-5 py-2 bg-gray-200 text-gray-700 font-medium rounded-lg shadow hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-1 transition disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ backLabel() }}
  </button>
  }
  <div class="ml-auto flex gap-3">
    @if (showNext()) {
    <button
      [attr.type]="nextType()"
      (click)="next.emit()"
      [disabled]="nextDisabled()"
      [class]="nextBtnClass()"
    >
      {{ nextLabel() }}
    </button>
    }
    <ng-content select="[actions]"></ng-content>
  </div>
</menu>
