<header class="nav-bar">
  <nav class="max-w-screen-xl mx-auto h-full flex items-center justify-between px-4">
    <div class="flex items-center gap-3">
      <img src="assets/logo.jpg" alt="Explora" class="marca" loading="lazy" />
    </div>

    <div class="flex items-center gap-3">
      @if (isAuthenticated()) {
      <span class="max-w-[180px] truncate text-slate-700 text-sm">
        {{ user()?.displayName || user()?.email }}
      </span>
      <img
        [src]="avatarUrl()"
        alt="Avatar"
        width="36"
        height="36"
        class="rounded-full header-avatar"
        loading="eager"
      />

      } @else {
      <button
        type="button"
        (click)="openDialog('login')"
        class="px-3 py-1 rounded bg-indigo-600 text-white hover:bg-indigo-700"
      >
        Iniciar sesión
      </button>
      }
    </div>
  </nav>
</header>

@if (loginModal()) {
<app-login-modal (close)="closeLoginModal()" (openRegister)="toRegister()"></app-login-modal>
} @if (registerModal()) {
<app-register-modal (close)="closeRegisterModal()" (switchToLogin)="toLogin()"></app-register-modal>
}
