<div class="min-h-screen w-full flex bg-gray-50">
  <div class="hidden md:block">
    <app-sidebar (addCard)="onAddCard()"></app-sidebar>
  </div>

  @if (mobileOpen()) {
  <div class="fixed inset-0 z-40">
    <div class="absolute inset-0 bg-black/40" (click)="closeMobile()"></div>
    <div
      class="absolute inset-y-0 left-0 w-72 max-w-[80vw] bg-white shadow-xl border-r border-gray-200 p-4"
    >
      <app-sidebar (addCard)="closeMobile(); onAddCard()"></app-sidebar>
    </div>
  </div>
  }

  <main class="flex-1 p-4 md:p-6">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg border border-gray-300 bg-white shadow-sm"
          (click)="toggleMobile()"
          aria-label="Abrir menú"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        </button>
        <h1 class="text-2xl font-semibold text-gray-900">Dashboard</h1>
      </div>
    </header>

    <section class="text-gray-600">
      <p>Selecciona una opción en el sidebar para comenzar.</p>
    </section>
  </main>

  <app-add-card #addCardRef></app-add-card>
</div>
